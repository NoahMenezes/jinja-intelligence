name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: node dist/server.js --version
      - name: Assert npm file list stays lean
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          grep -E "dist/server.js" pack.log
          if grep -E "(\bsrc/|\btest/)" pack.log; then
            echo "ERROR: src/ or test/ would ship to npm" >&2
            exit 1
          fi

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
